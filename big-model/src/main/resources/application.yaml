# 服务器配置
server:
    port: 8081
    servlet:
        context-path: /api # 接口统一前缀

# Spring核心配置
spring:
    application:
        name: enterprise_assistant_backend
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://localhost:3306/enterprise_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true}
        username: ${DB_USERNAME:change-me}
        password: ${DB_PASSWORD:change-me}
#    # 连接池配置（Hikari）
        hikari:
            maximum-pool-size: 10 # 最大连接数
            minimum-idle: 5 # 最小空闲连接
            idle-timeout: 300000 # 空闲连接超时时间（5分钟）
            connection-timeout: 20000 # 连接超时时间（20秒）
#    # Redis配置
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            database: 0 # 使用第0个库
            # 连接池配置
            lettuce:
                pool:
                    max-active: 8 # 最大连接数
                    max-idle: 8 # 最大空闲连接
                    min-idle: 0 # 最小空闲连接
                    max-wait: 6000 # 连接等待时间（-1表示无限制）
            timeout: 10000 # 连接超时时间（10秒）
    redisson:
        singleServerConfig:
            address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
            password: ${REDIS_PASSWORD:}
            timeout: 5000

# AI服务配置
ai:
    service:
        host: localhost
        port: 8000
#
## MyBatis-Plus配置
mybatis-plus:
    mapper-locations: classpath:mapper/**/*.xml # Mapper.xml文件路径
    type-aliases-package: com.spongebob.magic_conch_backend.entity # 实体类包路径
    configuration:
        map-underscore-to-camel-case: true # 下划线转驼峰（sys_user → SysUser）
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志（开发环境）

## JWT配置（登录态）
#jwt:
#    secret: ${JWT_SECRET:change-me} # Set through an environment variable in real deployments.
#    expire: 3600000 # 令牌过期时间（1小时，单位ms）
#
## 日志配置
logging:
    level:
        com.spongebob: info # 自定义包日志级别

